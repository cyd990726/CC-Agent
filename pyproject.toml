[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-runtime"
version = "0.1.0"
description = "A minimal educational coding-agent runtime"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0,<4.0",
    "rich>=13.0,<15.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent*", "model*", "tools*", "ui*"]

[tool.ruff]
line-length = 88
